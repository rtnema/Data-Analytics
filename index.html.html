<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribution — a small tool for looking at numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECF0EE;
    --panel: #FBFCFB;
    --ink: #17211E;
    --ink-soft: #5C6864;
    --line: #D3DBD7;
    --line-strong: #B7C2BD;
    --accent-bar: #2F6F6B;
    --accent-bar-hover: #23524F;
    --accent-mean: #C1440E;
    --accent-median: #2952A3;
    --focus: #2952A3;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  header{
    margin-bottom: 40px;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 24px;
  }

  h1{
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }

  header p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 52ch;
  }

  h2{
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }

  textarea{
    width: 100%;
    min-height: 96px;
    resize: vertical;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
  }

  textarea:focus-visible,
  button:focus-visible,
  label.file-btn:focus-within{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .upload-row{
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .file-btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    border: 1px solid var(--line-strong);
    background: #fff;
    padding: 9px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--ink);
  }
  .file-btn:hover{ border-color: var(--accent-bar); }

  .file-name{
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .msg{
    margin-top: 12px;
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    color: var(--accent-mean);
    display: none;
  }
  .msg.show{ display: block; }

  .button-row{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  button.btn{
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    font-weight: 500;
    padding: 11px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  button.btn:hover{ border-color: var(--accent-bar); color: var(--accent-bar-hover); }
  button.btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  button.btn-primary{
    background: var(--accent-bar);
    border-color: var(--accent-bar);
    color: #fff;
  }
  button.btn-primary:hover{ background: var(--accent-bar-hover); border-color: var(--accent-bar-hover); color: #fff; }

  button.btn-ghost{
    background: transparent;
    border-color: transparent;
    color: var(--ink-soft);
  }
  button.btn-ghost:hover{ color: var(--ink); border-color: var(--line-strong); }

  .chart-wrap{
    width: 100%;
    overflow-x: auto;
  }

  #chartSvg{
    width: 100%;
    height: auto;
    display: block;
  }

  .bar{
    fill: var(--accent-bar);
    transition: fill 0.15s ease;
  }
  .bar-group{
    transition: transform 0.7s cubic-bezier(.65,0,.35,1);
  }
  @media (prefers-reduced-motion: reduce){
    .bar-group{ transition: none; }
  }

  .axis-line{ stroke: var(--line-strong); stroke-width: 1; }
  .grid-line{ stroke: var(--line); stroke-width: 1; }
  .axis-label{
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    fill: var(--ink-soft);
  }
  .value-label{
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    fill: var(--ink-soft);
    text-anchor: middle;
  }

  .stat-line{
    stroke-width: 1.5;
    stroke-dasharray: 5 4;
  }
  .stat-line-label{
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
  }

  .legend{
    display: flex;
    gap: 20px;
    margin: 14px 2px 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .legend span{ display: inline-flex; align-items: center; gap: 6px; }
  .legend i{
    width: 14px; height: 3px; display: inline-block; border-radius: 2px;
  }

  .stats-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .stat-cell{
    background: var(--panel);
    padding: 16px 14px;
  }

  .stat-cell .label{
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .stat-cell .value{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 22px;
  }

  footer{
    margin-top: 40px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace;
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <h1>Distribution</h1>
    <p>Paste a list of numbers or upload a single-column CSV. Visualize the order they arrived in, sort them, and read off the shape of the data.</p>
  </header>

  <section class="panel" id="input-panel">
    <h2>01 — Enter data</h2>
    <textarea id="dataInput" placeholder="e.g. 162, 170, 158, 181, 175 — or one number per line"></textarea>
    <div class="upload-row">
      <label class="file-btn" for="csvFile" tabindex="0">Upload CSV</label>
      <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
      <span class="file-name" id="fileName"></span>
    </div>
    <div class="msg" id="inputMsg"></div>
  </section>

  <div class="button-row">
    <button class="btn btn-primary" id="visualizeBtn">Visualize</button>
    <button class="btn" id="sampleBtn">Load sample: 30 student heights</button>
    <button class="btn btn-ghost" id="resetBtn">Reset</button>
  </div>

  <section class="panel" id="chart-panel" hidden>
    <h2>02 — Chart</h2>
    <div class="chart-wrap">
      <svg id="chartSvg" viewBox="0 0 800 380" preserveAspectRatio="xMinYMin meet"></svg>
    </div>
    <div class="legend" id="legend" hidden>
      <span><i style="background:var(--accent-mean)"></i>Mean</span>
      <span><i style="background:var(--accent-median)"></i>Median</span>
    </div>
    <div class="button-row" style="margin-top:20px; margin-bottom:0;">
      <button class="btn" id="sortBtn">Sort ascending</button>
      <button class="btn btn-primary" id="calcBtn">Calculate</button>
    </div>
  </section>

  <section class="panel" id="stats-panel" hidden>
    <h2>03 — Summary</h2>
    <div class="stats-grid" id="statsGrid"></div>
  </section>

  <footer>Runs entirely in your browser. Nothing you enter is uploaded anywhere.</footer>

</div>

<script>
(function(){
  const dataInput   = document.getElementById('dataInput');
  const csvFile     = document.getElementById('csvFile');
  const fileName    = document.getElementById('fileName');
  const inputMsg    = document.getElementById('inputMsg');

  const visualizeBtn = document.getElementById('visualizeBtn');
  const sampleBtn     = document.getElementById('sampleBtn');
  const resetBtn       = document.getElementById('resetBtn');
  const sortBtn         = document.getElementById('sortBtn');
  const calcBtn           = document.getElementById('calcBtn');

  const chartPanel = document.getElementById('chart-panel');
  const statsPanel = document.getElementById('stats-panel');
  const statsGrid   = document.getElementById('statsGrid');
  const legend       = document.getElementById('legend');
  const svg = document.getElementById('chartSvg');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const MARGIN = { top: 20, right: 24, bottom: 28, left: 44 };
  const CHART_W = 800, CHART_H = 380;

  // bars: array of { id, value }, in the order they should currently render
  let bars = [];
  let calculated = false;

  function showMsg(text){
    inputMsg.textContent = text;
    inputMsg.classList.add('show');
  }
  function clearMsg(){
    inputMsg.textContent = '';
    inputMsg.classList.remove('show');
  }

  function parseNumbers(text){
    return text
      .split(/[\s,;]+/)
      .map(s => s.trim())
      .filter(s => s.length > 0)
      .map(Number)
      .filter(n => !isNaN(n));
  }

  function sampleHeights(){
    // heights (cm) of 30 students, fixed sample set
    return [162,170,158,181,175,166,159,172,177,168,
             183,155,164,171,179,160,174,169,176,163,
             157,182,167,173,161,178,165,170,180,156];
  }

  // ---- CSV upload ----
  csvFile.addEventListener('change', () => {
    const file = csvFile.files[0];
    if(!file) return;
    fileName.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result;
      const rows = text.split(/\r?\n/);
      const values = [];
      rows.forEach(row => {
        if(!row.trim()) return;
        const firstCell = row.split(',')[0].trim();
        const n = Number(firstCell);
        if(!isNaN(firstCell === '' ? NaN : n)) values.push(n);
      });
      if(values.length === 0){
        showMsg('Couldn\u2019t find any numbers in that CSV. Check it has a single numeric column.');
        return;
      }
      clearMsg();
      dataInput.value = values.join(', ');
    };
    reader.readAsText(file);
  });

  // ---- Buttons: sample / reset ----
  sampleBtn.addEventListener('click', () => {
    dataInput.value = sampleHeights().join(', ');
    fileName.textContent = '';
    csvFile.value = '';
    clearMsg();
  });

  resetBtn.addEventListener('click', () => {
    dataInput.value = '';
    fileName.textContent = '';
    csvFile.value = '';
    clearMsg();
    bars = [];
    calculated = false;
    chartPanel.hidden = true;
    statsPanel.hidden = true;
    legend.hidden = true;
    svg.innerHTML = '';
  });

  // ---- Visualize ----
  visualizeBtn.addEventListener('click', () => {
    const values = parseNumbers(dataInput.value);
    if(values.length === 0){
      showMsg('Enter at least one number, paste a list, or upload a CSV first.');
      return;
    }
    clearMsg();
    bars = values.map((v, i) => ({ id: i, value: v }));
    calculated = false;
    legend.hidden = true;
    chartPanel.hidden = false;
    statsPanel.hidden = true;
    renderChart(bars, { animate: false });
  });

  // ---- Sort ----
  sortBtn.addEventListener('click', () => {
    if(bars.length === 0) return;
    bars = [...bars].sort((a,b) => a.value - b.value);
    renderChart(bars, { animate: true });
  });

  // ---- Calculate ----
  calcBtn.addEventListener('click', () => {
    if(bars.length === 0) return;
    const stats = computeStats(bars.map(b => b.value));
    renderStats(stats);
    calculated = true;
    legend.hidden = false;
    statsPanel.hidden = false;
    drawStatLines(stats);
  });

  // ---- Chart rendering ----
  let scaleY = null;
  let plotArea = null;

  function renderChart(barData, opts){
    const animate = opts && opts.animate;
    const n = barData.length;
    const plotW = CHART_W - MARGIN.left - MARGIN.right;
    const plotH = CHART_H - MARGIN.top - MARGIN.bottom;
    plotArea = { x0: MARGIN.left, y0: MARGIN.top, w: plotW, h: plotH };

    const maxVal = Math.max(...barData.map(b => b.value));
    const niceMax = maxVal * 1.15;
    const y = (v) => MARGIN.top + plotH - (v / niceMax) * plotH;
    scaleY = { toPixel: y, niceMax };

    const slot = plotW / n;
    const barW = Math.max(slot * 0.62, 1);

    if(!animate){
      svg.innerHTML = '';

      // grid + y axis
      const ticks = 5;
      for(let i = 0; i <= ticks; i++){
        const val = (niceMax / ticks) * i;
        const yy = y(val);
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', MARGIN.left);
        line.setAttribute('x2', CHART_W - MARGIN.right);
        line.setAttribute('y1', yy);
        line.setAttribute('y2', yy);
        line.setAttribute('class', i === ticks ? 'axis-line' : 'grid-line');
        svg.appendChild(line);

        const label = document.createElementNS(SVG_NS, 'text');
        label.setAttribute('x', MARGIN.left - 8);
        label.setAttribute('y', yy + 3);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('class', 'axis-label');
        label.textContent = Math.round(val);
        svg.appendChild(label);
      }

      // x axis baseline
      const baseline = document.createElementNS(SVG_NS, 'line');
      baseline.setAttribute('x1', MARGIN.left);
      baseline.setAttribute('x2', CHART_W - MARGIN.right);
      baseline.setAttribute('y1', MARGIN.top + plotH);
      baseline.setAttribute('y2', MARGIN.top + plotH);
      baseline.setAttribute('class', 'axis-line');
      svg.appendChild(baseline);

      // bar groups, keyed by id so future re-renders can animate transform
      barData.forEach((b, idx) => {
        const g = document.createElementNS(SVG_NS, 'g');
        g.setAttribute('class', 'bar-group');
        g.setAttribute('data-id', b.id);
        const x = MARGIN.left + idx * slot + (slot - barW) / 2;
        g.setAttribute('transform', `translate(${x},0)`);

        const barH = (MARGIN.top + plotH) - y(b.value);
        const rect = document.createElementNS(SVG_NS, 'rect');
        rect.setAttribute('class', 'bar');
        rect.setAttribute('x', 0);
        rect.setAttribute('y', y(b.value));
        rect.setAttribute('width', barW);
        rect.setAttribute('height', barH);
        rect.setAttribute('rx', 1.5);
        g.appendChild(rect);

        if(n <= 40){
          const label = document.createElementNS(SVG_NS, 'text');
          label.setAttribute('class', 'value-label');
          label.setAttribute('x', barW / 2);
          label.setAttribute('y', y(b.value) - 6);
          label.textContent = b.value;
          g.appendChild(label);
        }

        svg.appendChild(g);
      });
    } else {
      // animate existing groups to new x positions based on new order
      barData.forEach((b, idx) => {
        const g = svg.querySelector(`.bar-group[data-id="${b.id}"]`);
        if(!g) return;
        const x = MARGIN.left + idx * slot + (slot - barW) / 2;
        g.setAttribute('transform', `translate(${x},0)`);
      });
    }

    // if stats were already calculated, redraw lines on top after any re-render
    if(calculated && !animate){
      const stats = computeStats(barData.map(b => b.value));
      drawStatLines(stats);
    }
  }

  function drawStatLines(stats){
    // remove old lines if present
    svg.querySelectorAll('.stat-line, .stat-line-label').forEach(el => el.remove());
    if(!scaleY) return;

    [
      { value: stats.mean,   color: 'var(--accent-mean)',   label: 'mean',   dy: -6 },
      { value: stats.median, color: 'var(--accent-median)', label: 'median', dy: 12 }
    ].forEach(item => {
      const yy = scaleY.toPixel(item.value);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', MARGIN.left);
      line.setAttribute('x2', CHART_W - MARGIN.right);
      line.setAttribute('y1', yy);
      line.setAttribute('y2', yy);
      line.setAttribute('class', 'stat-line');
      line.setAttribute('stroke', getComputedColor(item.color));
      svg.appendChild(line);

      const label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('x', CHART_W - MARGIN.right - 4);
      label.setAttribute('y', yy + item.dy);
      label.setAttribute('text-anchor', 'end');
      label.setAttribute('class', 'stat-line-label');
      label.setAttribute('fill', getComputedColor(item.color));
      label.textContent = `${item.label} ${round(item.value)}`;
      svg.appendChild(label);
    });
  }

  function getComputedColor(varRef){
    const match = varRef.match(/--[\w-]+/);
    if(!match) return varRef;
    return getComputedStyle(document.documentElement).getPropertyValue(match[0]).trim();
  }

  // ---- Statistics ----
  function round(n){
    return Math.round(n * 100) / 100;
  }

  function computeStats(values){
    const n = values.length;
    const sorted = [...values].sort((a,b) => a - b);
    const sum = values.reduce((s,v) => s + v, 0);
    const mean = sum / n;

    const median = n % 2 === 1
      ? sorted[(n - 1) / 2]
      : (sorted[n/2 - 1] + sorted[n/2]) / 2;

    const freq = {};
    values.forEach(v => { freq[v] = (freq[v] || 0) + 1; });
    const maxFreq = Math.max(...Object.values(freq));
    let mode;
    if(maxFreq === 1){
      mode = 'None';
    } else {
      mode = Object.keys(freq)
        .filter(k => freq[k] === maxFreq)
        .map(Number)
        .sort((a,b) => a - b)
        .join(', ');
    }

    const variance = values.reduce((s,v) => s + Math.pow(v - mean, 2), 0) / n;
    const stdDev = Math.sqrt(variance);

    const min = sorted[0];
    const max = sorted[n - 1];
    const range = max - min;

    return { n, mean, median, mode, stdDev, range, min, max };
  }

  function renderStats(stats){
    statsGrid.innerHTML = '';
    const cells = [
      { label: 'Mean',       value: round(stats.mean) },
      { label: 'Median',     value: round(stats.median) },
      { label: 'Mode',       value: stats.mode },
      { label: 'Std. dev.',  value: round(stats.stdDev) },
      { label: 'Range',      value: round(stats.range) },
      { label: 'Min',        value: stats.min },
      { label: 'Max',        value: stats.max },
      { label: 'Count',      value: stats.n }
    ];
    cells.forEach(c => {
      const div = document.createElement('div');
      div.className = 'stat-cell';
      div.innerHTML = `<div class="label">${c.label}</div><div class="value">${c.value}</div>`;
      statsGrid.appendChild(div);
    });
  }

})();
</script>

</body>
</html>
